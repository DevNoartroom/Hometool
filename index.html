<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClaudeyTools Home</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* Farben aus der Palette: #d4efe3 #9ddbd2 #75c2b9 #63b7ad #76b8a9 #275951 #629788 #7d9c9c #4d6c62 #4e6c6c */
:root{--bg:#eef7f3;--card:#ffffff;--fg:#1b3a34;--mut:#4d6c62;--pri:#275951;--on:#ffffff;--acc:#63b7ad;--soft:#d4efe3;--onsoft:#275951;--line:rgba(39,89,81,.14);--warn:#a8432c;--wsoft:#f6e2db;--mid:#8a6418;--msoft:#f4ecd6;color-scheme:light}
.dark{--bg:#132a26;--card:#1b3c36;--fg:#e6f6ef;--mut:#9fc4bb;--pri:#75c2b9;--on:#0f2925;--acc:#63b7ad;--soft:#275951;--onsoft:#e6f6ef;--line:rgba(212,239,227,.12);--warn:#f2a08a;--wsoft:rgba(242,160,138,.14);--mid:#e8c77d;--msoft:rgba(232,199,125,.13);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--pri);margin-right:auto;line-height:1.1}
.brand small{display:block;font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tabs{display:flex;gap:4px}
.tb{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut);position:relative}
.tb.on{background:var(--soft);color:var(--onsoft)}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
svg.g{width:19px;height:19px;flex:none}
.dot{position:absolute;top:3px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--pri);color:var(--on);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.dot.w{background:var(--warn);color:#fff}
.tabs .dot{top:-4px;right:-6px}.tabs .tb{margin-right:4px}
.dark .dot.w{color:#2a120c}
main{max-width:720px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.bbar{display:none}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 0 6px}
.ct span:last-child{letter-spacing:0;text-transform:none;font-weight:500;font-size:12.5px}
.item{display:flex;align-items:center;gap:11px;padding:9px 0}
.item+.item,.steps+.item{border-top:1px solid var(--line)}
.it{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column}
.tt{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.it small,.small{color:var(--mut);font-size:12.5px}
.done .tt{text-decoration:line-through;color:var(--mut);font-weight:500}
.chev{color:var(--mut);font-size:12px;width:14px;text-align:center}
.cb{width:26px;height:26px;flex:none;border:2px solid var(--acc);border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;padding:0;color:var(--on)}
.cb.on{background:var(--pri);border-color:var(--pri)}
.cb.sm{width:20px;height:20px;border-radius:7px;font-size:11px}
.steps{padding:0 0 8px 37px}
.st{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:5px 0;text-align:left}
.st .tt{font-weight:500;font-size:14px}
.note{font-size:13px;color:var(--mut);margin:0 0 6px;white-space:pre-wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--pri);color:var(--on);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:var(--warn);color:#fff;border-color:transparent}
.dark .btn.danger{color:#2a120c}
.btn:active,.cb:active,.chip:active{transform:scale(.96)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.mt{margin-top:10px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;width:100%}
textarea{resize:vertical}
.add{display:flex;gap:8px;align-items:center}
.add input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--pri);color:var(--on);border-color:transparent}
label.chip{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
label.chip input{accent-color:var(--pri);margin:0}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;margin-right:4px}
.b-warn{background:var(--wsoft);color:var(--warn)}
.b-mid{background:var(--msoft);color:var(--mid)}
.b-soft{background:var(--soft);color:var(--onsoft)}
.bar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--pri);color:var(--on)}
.wnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wnav b{flex:1;text-align:center}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:2px}
.empty{color:var(--mut);font-size:13.5px;padding:4px 0}
.q{font-weight:500;color:var(--mut);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld>input,.fld>select,.fld>textarea{color:var(--fg);font-weight:400;font-size:15px}
.two{display:flex;gap:8px}.two>.fld{flex:1;min-width:0}
#dlg{position:fixed;inset:0;z-index:50;background:rgba(15,41,37,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dark #dlg{background:rgba(0,0,0,.55)}
.dlgb{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(15,41,37,.25)}
.dlgb h2{margin:0 0 4px;font-size:19px}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dbtn .left{margin-right:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:var(--on);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 10px 26px rgba(15,41,37,.3)}
@media(max-width:720px){
 .tabs{display:none}
 main{padding-bottom:120px}
 h1{font-size:23px}
 .bbar{display:flex;position:fixed;z-index:30;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px;gap:2px;box-shadow:0 10px 30px rgba(15,41,37,.18)}
 .bbar .tb{flex:1;flex-direction:column;gap:2px;padding:7px 2px 5px;font-size:10.5px;border-radius:18px}
 .bbar .tb svg.g{width:21px;height:21px}
 .bbar .dot{right:calc(50% - 22px)}
 #toast{bottom:104px}
}
@media(prefers-reduced-motion:reduce){.btn:active,.cb:active,.chip:active{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="brand">Home<small>ClaudeyTools</small></div><nav class="tabs" id="tabs" aria-label="Bereiche"></nav><button class="ic" data-a="thm" id="thm" aria-label="Hell oder dunkel umschalten"></button></header>
<main id="main"></main>
<nav class="bbar" id="bbar" aria-label="Bereiche"></nav>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div id="dlg" hidden></div><div id="toast" role="status" hidden></div>
<script>
/* Daten liegen nur im Browser dieses Geräts (localStorage, Schlüssel "home-v1").
   S.tasks: [{id,n,p,r:'once|daily|weekly|monthly|interval',date,days:[0-6 ab Mo],md:1-28 oder 0=letzter Tag,iv,start,tm,du,steps:[],note}]
   S.done: {"id|datum":1, "id|datum|schritt":1}  ·  S.shop: [{id,n,x}]  ·  S.food: [{id,n,q,exp,o}]  ·  S.people: ["Ich",..] */
var K='home-v1',S={};
try{S=JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){S={}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
S.tasks=S.tasks||[];S.done=S.done||{};S.shop=S.shop||[];S.food=S.food||[];S.people=S.people&&S.people.length?S.people:['Ich'];S.pf=S.pf||'';
var V='heute',AV='woche',WO=0,OPEN={},DLG=null;
var DN=['Mo','Di','Mi','Do','Fr','Sa','So'],DLN=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],BY=['MO','TU','WE','TH','FR','SA','SU'],
 MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],ORTE=['Kühlschrank','Gefrierfach','Vorratsschrank'],
 RN={once:'Einmalig',daily:'Täglich',weekly:'An Wochentagen',monthly:'Monatlich',interval:'Alle X Tage'};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function z(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pd(s){return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))}
function add(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function today(){return iso(new Date())}
function wdi(s){return (pd(s).getDay()+6)%7}
function fmt(s){return DN[wdi(s)]+', '+s.slice(8)+'.'+s.slice(5,7)+'.'}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function mins(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:-1}
function endT(t){var m=mins(t.tm)+(+t.du||30);return z(Math.floor(m/60)%24)+':'+z(m%60)}
function isDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function msg(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(msg.t);msg.t=setTimeout(function(){e.hidden=true},2600)}
function task(id){return S.tasks.filter(function(t){return t.id===id})[0]}
var G={heute:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',
 aufgaben:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>',
 einkauf:'<path d="M5.5 8h13l-1.2 12H6.7z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
 vorrat:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 10h12M9 5.5v2M9 13v3"/>',
 mehr:'<circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'};
function gl(k){return '<svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+G[k]+'</svg>'}

/* alte Haken nach 90 Tagen aufräumen */
(function(){var lim=add(today(),-90);Object.keys(S.done).forEach(function(k){var d=k.split('|')[1];if(isDate(d)&&d<lim)delete S.done[k]})})();

/* ---------- Aufgaben-Logik ---------- */
function occ(t,ds){var r=t.r||'once';if(r==='once')return t.date===ds;if(t.start&&ds<t.start)return false;
 if(r==='daily')return true;
 if(r==='weekly')return (t.days||[]).indexOf(wdi(ds))>=0;
 if(r==='monthly'){var d=pd(ds),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),md=+t.md;return d.getDate()===(md?Math.min(md,last):last)}
 if(r==='interval'){var n=Math.max(1,+t.iv||1);return diff(t.start||ds,ds)%n===0}
 return false}
function firstOcc(t){if((t.r||'once')==='once')return t.date||'';var s=t.start||today();for(var i=0;i<400;i++){var d=add(s,i);if(occ(t,d))return d}return ''}
function rtxt(t){var r=t.r||'once';
 if(r==='once')return t.date?fmt(t.date):'jederzeit';
 if(r==='daily')return 'täglich';
 if(r==='weekly'){var d=(t.days||[]).slice().sort();return d.length===7?'täglich':'jeden '+d.map(function(i){return DN[i]}).join(', ')}
 if(r==='monthly')return +t.md?'monatlich am '+t.md+'.':'am Monatsende';
 return 'alle '+(+t.iv||1)+' Tage'}
function pmatch(t){return !S.pf||!t.p||t.p===S.pf}
function dk(t,ds){return t.id+'|'+ds}
function byTime(a,b){var x=mins(a.tm),y=mins(b.tm);return (x<0?9999:x)-(y<0?9999:y)}
function row(t,ds,extra){var k=dk(t,ds),on=!!S.done[k],st=t.steps||[],sd=st.filter(function(x,i){return S.done[k+'|'+i]}).length,m=[],det=st.length||t.note;
 if(extra)m.push(extra);if(t.tm)m.push(esc(t.tm)+'–'+endT(t));if(t.p)m.push(esc(t.p));if(st.length)m.push(sd+'/'+st.length+' Schritte');
 var h='<div class="item'+(on?' done':'')+'"><button class="cb'+(on?' on':'')+'" data-a="tk" data-v="'+esc(t.id+'|'+ds)+'" aria-pressed="'+on+'" aria-label="'+esc(t.n)+(on?': wieder offen':': erledigt')+'">'+(on?'✓':'')+'</button>'
  +'<button class="it" data-a="'+(det?'op':'tE')+'" data-v="'+esc(det?k:t.id)+'"'+(det?' aria-expanded="'+!!OPEN[k]+'"':'')+'><span class="tt">'+esc(t.n)+'</span>'+(m.length?'<small>'+m.join(' · ')+'</small>':'')+'</button>'+(det?'<span class="chev" aria-hidden="true">'+(OPEN[k]?'▾':'▸')+'</span>':'')+'</div>';
 if(det&&OPEN[k]){h+='<div class="steps">'+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')
  +st.map(function(x,i){var o=!!S.done[k+'|'+i];return '<button class="st'+(o?' done':'')+'" data-a="st" data-v="'+esc(k+'|'+i)+'" aria-pressed="'+o+'"><span class="cb sm'+(o?' on':'')+'">'+(o?'✓':'')+'</span><span class="tt">'+esc(x)+'</span></button>'}).join('')
  +'<button class="btn sm mt" data-a="tE" data-v="'+esc(t.id)+'">Bearbeiten</button></div>'}
 return h}
function tgTask(id,ds){var t=task(id);if(!t)return;var k=dk(t,ds),st=t.steps||[];
 if(S.done[k]){delete S.done[k];st.forEach(function(x,i){delete S.done[k+'|'+i]})}
 else{S.done[k]=ds==='-'?today():1;st.forEach(function(x,i){S.done[k+'|'+i]=1});msg('Erledigt: '+t.n)}save();render()}
function tgStep(v){var p=v.split('|'),t=task(p[0]);if(!t)return;var k=p[0]+'|'+p[1],sk=k+'|'+p[2];
 if(S.done[sk])delete S.done[sk];else S.done[sk]=1;
 var all=(t.steps||[]).every(function(x,i){return S.done[k+'|'+i]});
 if(all){if(!S.done[k])msg('Erledigt: '+t.n);S.done[k]=p[1]==='-'?today():1}else delete S.done[k];save();render()}

/* ---------- Vorrat ---------- */
function fst(f){if(!f.exp)return ['','ohne Datum'];var d=diff(today(),f.exp);
 if(d<0)return ['b-warn','seit '+(-d)+(d===-1?' Tag':' Tagen')+' abgelaufen'];if(d===0)return ['b-warn','läuft heute ab'];if(d===1)return ['b-warn','läuft morgen ab'];
 if(d<=3)return ['b-mid','noch '+d+' Tage'];return ['','bis '+f.exp.slice(8)+'.'+f.exp.slice(5,7)+'.']}
function soon(){var lim=add(today(),3);return S.food.filter(function(f){return f.exp&&f.exp<=lim}).sort(function(a,b){return a.exp<b.exp?-1:1})}
function frow(f,showOrt){var s=fst(f);return '<div class="item"><button class="it" data-a="fE" data-v="'+esc(f.id)+'"><span class="tt">'+esc(f.n)+(f.q?' <span class="q">· '+esc(f.q)+'</span>':'')+'</span><small>'+(showOrt?esc(f.o)+' ':'')+(s[0]?'<span class="badge '+s[0]+'">'+s[1]+'</span>':s[1])+'</small></button>'
 +'<button class="btn sm" data-a="f2s" data-v="'+esc(f.id)+'" aria-label="'+esc(f.n)+' auf die Einkaufsliste">+ Einkauf</button><button class="btn sm" data-a="fX" data-v="'+esc(f.id)+'" aria-label="'+esc(f.n)+' verbraucht, entfernen">Weg</button></div>'}
function shopAdd(n){n=String(n||'').trim();if(!n)return false;var ex=S.shop.filter(function(x){return x.n.toLowerCase()===n.toLowerCase()&&!x.x})[0];if(ex){msg(n+' steht schon auf der Liste.');return false}S.shop.push({id:uid('s'),n:n,x:0});return true}

/* ---------- Ansichten ---------- */
function pfChips(){if(S.people.length<2)return '';return '<div class="chips" style="margin:0 0 12px">'+[''].concat(S.people).map(function(p){return '<button class="chip'+(S.pf===p?' on':'')+'" data-a="pf" data-v="'+esc(p)+'" aria-pressed="'+(S.pf===p)+'">'+(p?esc(p):'Alle')+'</button>'}).join('')+'</div>'}
function vHeute(){var td=today(),h=new Date().getHours(),gr=h<11?'Guten Morgen':h<18?'Hallo':'Guten Abend',d=pd(td),T=S.tasks.filter(pmatch),
 it=T.filter(function(t){return occ(t,td)}).sort(byTime),
 ov=T.filter(function(t){return (t.r||'once')==='once'&&t.date&&t.date<td&&!S.done[dk(t,t.date)]}).sort(function(a,b){return a.date<b.date?-1:1}),
 un=T.filter(function(t){var v=S.done[dk(t,'-')];return (t.r||'once')==='once'&&!t.date&&(!v||v>=td)}),
 tot=it.length+un.length,dn=it.filter(function(t){return S.done[dk(t,td)]}).length+un.filter(function(t){return S.done[dk(t,'-')]}).length,
 out='<h1>'+gr+'</h1><div class="sub">'+DLN[wdi(td)]+', '+d.getDate()+'. '+MN[d.getMonth()]+'</div>'+pfChips();
