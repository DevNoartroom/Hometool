/* ---------- Aufgaben-Logik ---------- */
function occ(t,ds){var r=t.r||'once';if(r==='once')return t.date===ds;if(t.start&&ds<t.start)return false;
 if(r==='daily')return true;
 if(r==='weekly')return (t.days||[]).indexOf(wdi(ds))>=0;
 if(r==='monthly'){var d=pd(ds),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),md=+t.md;return d.getDate()===(md?Math.min(md,last):last)}
 if(r==='interval'){var n=Math.max(1,+t.iv||1);return diff(t.start||ds,ds)%n===0}
 return false}
function firstOcc(t){if((t.r||'once')==='once')return t.date||'';var s=t.start||today();for(var i=0;i<400;i++){var d=add(s,i);if(occ(t,d))return d}return ''}
function rtxt(t){var r=t.r||'once';
 if(r==='once')return t.date?fmt(t.date):'jederzeit';
 if(r==='daily')return 'täglich';
 if(r==='weekly'){var d=(t.days||[]).slice().sort();return d.length===7?'täglich':'jeden '+d.map(function(i){return DN[i]}).join(', ')}
 if(r==='monthly')return +t.md?'monatlich am '+t.md+'.':'am Monatsende';
 return 'alle '+(+t.iv||1)+' Tage'}
function pmatch(t){return !S.pf||!t.p||t.p===S.pf}
function dk(t,ds){return t.id+'|'+ds}
function byTime(a,b){var x=mins(a.tm),y=mins(b.tm);return (x<0?9999:x)-(y<0?9999:y)}
function row(t,ds,extra){var k=dk(t,ds),on=!!S.done[k],st=t.steps||[],sd=st.filter(function(x,i){return S.done[k+'|'+i]}).length,m=[],det=st.length||t.note;
 if(extra)m.push(extra);if(t.tm)m.push(esc(t.tm)+'–'+endT(t));if(t.p)m.push(esc(t.p));if(st.length)m.push(sd+'/'+st.length+' Schritte');
 var h='<div class="item'+(on?' done':'')+'"><button class="cb'+(on?' on':'')+'" data-a="tk" data-v="'+esc(t.id+'|'+ds)+'" aria-pressed="'+on+'" aria-label="'+esc(t.n)+(on?': wieder offen':': erledigt')+'">'+(on?'✓':'')+'</button>'
  +icoFor(t.n,'task')+'<button class="it" data-a="'+(det?'op':'tE')+'" data-v="'+esc(det?k:t.id)+'"'+(det?' aria-expanded="'+!!OPEN[k]+'"':'')+'><span class="tt">'+esc(t.n)+'</span>'+(m.length?'<small>'+m.join(' · ')+'</small>':'')+'</button>'+(det?'<span class="chev" aria-hidden="true">'+(OPEN[k]?'▾':'▸')+'</span>':'')+'</div>';
 if(det&&OPEN[k]){h+='<div class="steps">'+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')
  +st.map(function(x,i){var o=!!S.done[k+'|'+i];return '<button class="st'+(o?' done':'')+'" data-a="st" data-v="'+esc(k+'|'+i)+'" aria-pressed="'+o+'"><span class="cb sm'+(o?' on':'')+'">'+(o?'✓':'')+'</span><span class="tt">'+esc(x)+'</span></button>'}).join('')
  +'<button class="btn sm mt" data-a="tE" data-v="'+esc(t.id)+'">Bearbeiten</button></div>'}
 return h}
function tgTask(id,ds){var t=task(id);if(!t)return;var k=dk(t,ds),st=t.steps||[];
 if(S.done[k]){delete S.done[k];st.forEach(function(x,i){delete S.done[k+'|'+i]})}
 else{S.done[k]=ds==='-'?today():1;st.forEach(function(x,i){S.done[k+'|'+i]=1});msg('Erledigt: '+t.n)}save();render()}
function tgStep(v){var p=v.split('|'),t=task(p[0]);if(!t)return;var k=p[0]+'|'+p[1],sk=k+'|'+p[2];
 if(S.done[sk])delete S.done[sk];else S.done[sk]=1;
 var all=(t.steps||[]).every(function(x,i){return S.done[k+'|'+i]});
 if(all){if(!S.done[k])msg('Erledigt: '+t.n);S.done[k]=p[1]==='-'?today():1}else delete S.done[k];save();render()}
